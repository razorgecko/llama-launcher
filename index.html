<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>llama.cpp launcher</title>
<style>
  :root {
    --bg: #fafafa; --fg: #222; --muted: #777;
    --border: #ddd; --accent: #2e7d32; --accent-bg: #e8f5e9;
    --warn: #b26a00; --warn-bg: #fff3e0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 640px; margin: 1.5rem auto; padding: 0 1rem;
    background: var(--bg); color: var(--fg);
  }
  h2 { margin: 0 0 1rem; }
  nav { display: flex; gap: .5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  nav button {
    background: none; border: none; padding: .5rem 1rem;
    cursor: pointer; font-size: 1rem; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav button.active { color: var(--fg); border-color: var(--fg); }
  nav button.quit { margin-left: auto; color: #c62828; }
  .panel { display: none; }
  .panel.active { display: block; }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: .6rem .9rem; border: 1px solid var(--border);
    border-radius: 6px; margin: .4rem 0; background: white;
  }
  .row.running { background: var(--accent-bg); border-color: var(--accent); }
  .row.loading { background: var(--warn-bg); border-color: var(--warn); }
  .row .row-text { min-width: 0; flex: 1; }
  .row .name { font-weight: 600; }
  .row .desc { font-size: .85em; color: var(--muted); margin-top: .15rem; }
  .row .badge { color: var(--accent); margin-left: .5rem; font-size: .85em; font-weight: normal; }
  .row .badge.loading { color: var(--warn); }
  .row .actions { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }
  .row a { color: var(--accent); text-decoration: none; font-size: .9em; }
  .row a:hover { text-decoration: underline; }

  button.btn {
    padding: .35rem .9rem; cursor: pointer;
    border: 1px solid var(--border); border-radius: 4px;
    background: white; font-size: .9rem;
  }
  button.btn:hover { background: #f0f0f0; }
  button.btn.primary { background: var(--fg); color: white; border-color: var(--fg); }
  button.btn.primary:hover { background: #444; }
  button.btn.secondary { color: var(--accent); border-color: var(--accent); }
  button.btn.secondary:hover { background: var(--accent-bg); }

.empty { color: var(--muted); padding: 1rem; text-align: center; font-style: italic; }

  .section-header {
    margin: 1.2rem 0 .3rem; padding: 0 .2rem;
    font-size: .8em; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .row .star {
    background: none; border: none; padding: .2rem .4rem;
    cursor: pointer; font-size: 1.1rem; color: var(--muted); line-height: 1;
  }
  .row .star.on { color: #f9a825; }
  .row .star:hover { color: #f9a825; }
  .row .arrow {
    background: white; border: 1px solid var(--border); padding: .15rem .35rem;
    cursor: pointer; font-size: .85rem; color: var(--muted);
    border-radius: 3px; line-height: 1;
  }
  .row .arrow:hover:not(:disabled) { background: #f0f0f0; color: var(--fg); }
  .row .arrow:disabled { opacity: .25; cursor: default; }
  .last-used-badge {
    display: inline-block; font-size: .7em; padding: 1px 6px;
    background: #e3f2fd; color: #0d47a1; border-radius: 3px;
    margin-left: .5rem; vertical-align: middle; font-weight: normal;
  }
  .row .menu-wrap { position: relative; }
  .row .menu-btn {
    background: none; border: 1px solid var(--border); padding: .15rem .45rem;
    cursor: pointer; font-size: 1rem; color: var(--muted);
    border-radius: 3px; line-height: 1;
  }
  .row .menu-btn:hover { background: #f0f0f0; color: var(--fg); }
  .row .menu-dropdown {
    display: none; position: absolute; right: 0; top: calc(100% + 3px);
    background: white; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); min-width: 120px; z-index: 100;
  }
  .row .menu-dropdown.open { display: block; }
  .row .menu-dropdown button {
    display: block; width: 100%; text-align: left;
    background: none; border: none; padding: .45rem .75rem;
    cursor: pointer; font-size: .9em; color: var(--fg);
  }
  .row .menu-dropdown button:hover:not(:disabled) { background: #f5f5f5; }
  .row .menu-dropdown button:disabled { color: var(--muted); cursor: default; }
  .row .menu-dropdown button.danger { color: #c62828; }
  .row .menu-dropdown button.danger:disabled { color: #e57373; }
  .row .menu-dropdown button.danger:hover:not(:disabled) { background: #ffebee; }
  .row .menu-dropdown hr { margin: .2rem 0; border: none; border-top: 1px solid var(--border); }
  .stop-hint { font-size: .8em; opacity: .7; }

  /* settings */
  .field { margin: .8rem 0; }
  .field label { display: block; font-weight: 600; margin-bottom: .25rem; }
  .field .hint { font-size: .8em; color: var(--muted); margin-top: .2rem; }
  .field input[type=text], .field input[type=number] {
    width: 100%; padding: .4rem .6rem; font-size: .95rem;
    border: 1px solid var(--border); border-radius: 4px;
  }
  .field.checkbox { display: flex; align-items: center; gap: .5rem; }
  .field.checkbox label { margin: 0; font-weight: normal; }
  .restart-tag {
    display: inline-block; font-size: .7em; padding: 1px 6px;
    background: var(--warn-bg); color: var(--warn); border-radius: 3px;
    margin-left: .5rem; vertical-align: middle;
  }
  #save-msg { margin-left: 1rem; font-size: .9em; transition: opacity 0.5s ease; }
  #save-msg.ok { color: var(--accent); }
  #save-msg.warn { color: var(--warn); }
  #save-msg.err { color: #c62828; }

  /* logs */
  .logs-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: .5rem;
  }
  #logs-meta { font-size: .85em; color: var(--muted); }
  .logs-output {
    height: 70vh; overflow-y: auto;
    background: #1e1e1e; color: #e0e0e0;
    border-radius: 6px; padding: .6rem .8rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .82rem; line-height: 1.4;
    white-space: pre-wrap; word-break: break-word;
  }
  .log-line { padding: 1px 0; }
  .log-line.err    { color: #ff8a80; }
  .log-line.system { color: #80cbc4; font-style: italic; }

  /* danger zone */
  .danger-zone {
    margin-top: 2.5rem; padding: 1rem; border: 1px solid #ef9a9a;
    border-radius: 6px; background: #ffebee;
  }
  .danger-zone h3 { margin: 0 0 .3rem; color: #c62828; font-size: 1rem; }
  .danger-zone .hint { font-size: .85em; color: #555; margin: 0 0 .8rem; }
  button.btn.danger {
    background: #c62828; color: white; border-color: #c62828;
  }
  button.btn.danger:hover { background: #b71c1c; }

  /* profile search */
  .profiles-toolbar { display: flex; gap: .5rem; margin-bottom: .5rem; }
  #profile-search {
    flex: 1; padding: .4rem .6rem; font-size: .95rem;
    border: 1px solid var(--border); border-radius: 4px;
    background: white; color: var(--fg);
  }

  /* profile editor modal */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white; border-radius: 8px; padding: 1.5rem;
    width: min(92vw, 660px); max-height: 88vh;
    display: flex; flex-direction: column; gap: .8rem;
    box-shadow: 0 4px 24px rgba(0,0,0,.2);
  }
  .modal h3 { margin: 0; font-size: 1rem; }
  .modal .filename-row { display: flex; align-items: center; gap: .5rem; font-size: .9em; }
  .modal .filename-row label { color: var(--muted); white-space: nowrap; }
  .modal .filename-row input {
    flex: 1; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .88rem; padding: .3rem .5rem;
    border: 1px solid var(--border); border-radius: 4px;
  }
  .modal .filename-row .ext { color: var(--muted); }
  .modal textarea {
    flex: 1; min-height: 280px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .82rem; line-height: 1.45;
    border: 1px solid var(--border); border-radius: 4px;
    padding: .5rem .7rem; resize: vertical;
  }
  .modal-actions { display: flex; gap: .5rem; align-items: center; }
  #editor-msg { font-size: .9em; }
  #editor-msg.ok  { color: var(--accent); }
  #editor-msg.err { color: #c62828; }
</style>
</head>
<body>

<h2>llama.cpp launcher</h2>

<nav>
  <button id="tab-profiles" class="active" onclick="showTab('profiles')">Profiles</button>
  <button id="tab-logs" onclick="showTab('logs')">Logs</button>
  <button id="tab-settings" onclick="showTab('settings')">Settings</button>
  <button class="quit" onclick="quitLauncher()">Quit</button>
</nav>

<section id="panel-profiles" class="panel active">
  <div class="profiles-toolbar">
    <button class="btn secondary" onclick="openNewEditor()">+ New</button>
    <input id="profile-search" type="search" placeholder="Filter profiles…" oninput="applyFilter()">
  </div>
  <div id="list"><div class="empty">loading…</div></div>
</section>

<section id="panel-logs" class="panel">
  <div class="logs-toolbar">
    <span id="logs-meta">—</span>
    <button class="btn" onclick="clearLogs()">Clear</button>
  </div>
  <div id="logs-output" class="logs-output"></div>
</section>

<section id="panel-settings" class="panel">
  <form id="settings-form" onsubmit="saveSettings(event)">
    <div id="settings-fields"></div>
    <div style="margin-top:1rem;">
      <button type="submit" class="btn primary">Save</button>
      <span id="save-msg"></span>
    </div>
  </form>
</section>

<div id="modal-backdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="editor-title">Edit profile</h3>
    <div class="filename-row">
      <label for="editor-filename">Filename</label>
      <input id="editor-filename" type="text" spellcheck="false">
      <span class="ext">.conf</span>
    </div>
    <textarea id="editor-content" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button id="editor-save-btn" class="btn primary" onclick="saveProfile()">Save</button>
      <button id="editor-cancel-btn" class="btn" onclick="closeEditor()">Cancel</button>
      <span id="editor-msg"></span>
    </div>
  </div>
</div>

<script>
const FIELD_META = {
  port:                   { label: "Launcher port",      type: "number", hint: "Port for this GUI." },
  host:                   { label: "Launcher host",      type: "text",   hint: "Bind address. 127.0.0.1 = local only." },
  llama_bin:              { label: "llama-server binary",        type: "text",  hint: "Command or absolute path to llama-server." },
  sd_bin:                 { label: "stable-diffusion binary",   type: "text",  hint: "Command or absolute path to sd-server (stable-diffusion.cpp)." },
  profiles_dir:           { label: "Profiles directory", type: "text",   hint: "Relative paths are resolved next to the script." },
  models_dir:             { label: "Models directory",   type: "text",   hint: "Base directory for --model values starting with ./  (e.g. ./llm/model.gguf). Leave empty to disable." },
  open_browser_on_launch: { label: "Open browser when launcher starts", type: "checkbox" },
  auto_open_model_ui:     { label: "Open model UI tab when starting a profile", type: "checkbox" },
};

let restartFields = [];

// --- tabs ---
function showTab(name) {
  for (const t of ["profiles", "logs", "settings"]) {
    document.getElementById("tab-" + t).classList.toggle("active", t === name);
    document.getElementById("panel-" + t).classList.toggle("active", t === name);
  }
  if (name === "settings") loadSettings();
  if (name === "logs") startLogsPolling();
  else stopLogsPolling();
}

// --- logs panel ---
let logCursor = 0;
let logsInterval = null;
let logsAutoscroll = true;

function startLogsPolling() {
  refreshLogs();
  if (!logsInterval) logsInterval = setInterval(refreshLogs, 1000);
}
function stopLogsPolling() {
  if (logsInterval) { clearInterval(logsInterval); logsInterval = null; }
}

async function refreshLogs() {
  let j;
  try { j = await (await fetch(`/api/logs?since=${logCursor}`)).json(); }
  catch { return; }
  const out = document.getElementById("logs-output");
  for (const line of j.lines) {
    const div = document.createElement("div");
    div.className = "log-line " + line.stream;
    div.textContent = line.text;
    out.appendChild(div);
  }
  // Cap rendered lines so the DOM doesn't grow unbounded over a long session.
  const MAX_DOM_LINES = 6000;
  while (out.childElementCount > MAX_DOM_LINES) out.removeChild(out.firstChild);

  logCursor = j.next;
  document.getElementById("logs-meta").textContent =
    j.next === 0 ? "no logs yet" : `${out.childElementCount} lines shown`;
  if (j.lines.length && logsAutoscroll) {
    out.scrollTop = out.scrollHeight;
  }
}

async function clearLogs() {
  await fetch("/api/logs/clear", { method: "POST" });
  document.getElementById("logs-output").innerHTML = "";
  // Don't reset logCursor — server's next_idx keeps advancing. Re-fetching
  // from 0 would be wasted bandwidth (server has dropped those lines anyway).
  refreshLogs();
}

// Detect whether the user has scrolled away from the bottom; if so, stop
// auto-scrolling so they can read history without being yanked back.
window.addEventListener("DOMContentLoaded", () => {
  const out = document.getElementById("logs-output");
  out.addEventListener("scroll", () => {
    const slack = out.scrollHeight - out.scrollTop - out.clientHeight;
    logsAutoscroll = slack < 5;
  });
});

// --- quit ---
async function quitLauncher() {
  if (!confirm("Quit the launcher? Any running model will be stopped.")) return;
  try { await fetch("/api/quit", { method: "POST" }); } catch {}
  document.body.innerHTML = `
    <div style="max-width:520px;margin:4rem auto;padding:2rem;text-align:center;
                font-family:system-ui;color:#444;">
      <h2>Launcher stopped.</h2>
      <p>You can close this tab.</p>
    </div>`;
}

let _pendingAutoOpen = false;
let _lastState = null;

// --- profiles panel ---
function applyFilter() {
  if (_lastState) renderProfiles(_lastState);
}

function sectionHeader(text) {
  const h = document.createElement("div");
  h.className = "section-header";
  h.textContent = text;
  return h;
}

function profileRow(p, s, opts = {}) {
  const { isLastUsed = false, isFavorite = false,
          showArrows = false, canMoveUp = false, canMoveDown = false } = opts;
  const isRunning = p.id === s.running;
  const isReady = isRunning && s.ready;

  const row = document.createElement("div");
  row.className = "row" + (isReady ? " running" : isRunning ? " loading" : "");

  // Left: name (with badges) + description
  const left = document.createElement("div");
  left.className = "row-text";
  const nameEl = document.createElement("div");
  nameEl.className = "name";
  nameEl.textContent = p.name;
  if (isLastUsed && !isRunning) {
    const badge = document.createElement("span");
    badge.className = "last-used-badge";
    badge.textContent = "last used";
    nameEl.appendChild(badge);
  }
  if (isRunning) {
    const badge = document.createElement("span");
    badge.className = "badge" + (isReady ? "" : " loading");
    badge.textContent = isReady ? "● running" : "● loading…";
    nameEl.appendChild(badge);
  }
  left.appendChild(nameEl);
  if (p.description) {
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = p.description;
    left.appendChild(desc);
  }
  row.appendChild(left);

  // Right: actions
  const actions = document.createElement("span");
  actions.className = "actions";

  if (showArrows) {
    const up = document.createElement("button");
    up.className = "arrow"; up.textContent = "↑"; up.title = "Move up";
    up.disabled = !canMoveUp;
    up.onclick = () => moveAction(p.id, "up");
    actions.appendChild(up);

    const down = document.createElement("button");
    down.className = "arrow"; down.textContent = "↓"; down.title = "Move down";
    down.disabled = !canMoveDown;
    down.onclick = () => moveAction(p.id, "down");
    actions.appendChild(down);
  }

  const star = document.createElement("button");
  star.className = "star" + (isFavorite ? " on" : "");
  star.textContent = isFavorite ? "★" : "☆";
  star.title = isFavorite ? "Remove from favorites" : "Add to favorites";
  star.onclick = () => favoriteAction(p.id);
  actions.appendChild(star);

  if (isReady && s.port) {
    const link = document.createElement("a");
    link.href = `http://localhost:${s.port}`;
    link.target = "_blank"; link.rel = "noopener";
    link.textContent = "Open UI ↗";
    actions.appendChild(link);
  }

  const menuWrap = document.createElement("span");
  menuWrap.className = "menu-wrap";
  const menuBtn = document.createElement("button");
  menuBtn.className = "menu-btn"; menuBtn.textContent = "⋮"; menuBtn.title = "More options";
  const menuDrop = document.createElement("div");
  menuDrop.className = "menu-dropdown";
  const editItem = document.createElement("button");
  if (isRunning) {
    editItem.textContent = "View";
    editItem.onclick = () => { closeDrop(); openEditor(p.id, p.name, true); };
  } else {
    editItem.textContent = "Edit";
    editItem.onclick = () => { closeDrop(); openEditor(p.id, p.name); };
  }
  const copyItem = document.createElement("button");
  copyItem.textContent = "Copy";
  copyItem.onclick = () => { closeDrop(); copyAction(p.id); };
  const hr = document.createElement("hr");
  const deleteItem = document.createElement("button");
  deleteItem.className = "danger";
  if (isRunning) {
    deleteItem.innerHTML = "Delete<br><span class='stop-hint'>(stop first)</span>";
    deleteItem.disabled = true;
  } else {
    deleteItem.textContent = "Delete";
    deleteItem.onclick = () => { closeDrop(); deleteAction(p.id, p.name); };
  }
  menuDrop.append(editItem, copyItem, hr, deleteItem);
  menuWrap.append(menuBtn, menuDrop);
  function closeDrop() { menuDrop.classList.remove("open"); }
  menuBtn.onclick = (e) => {
    e.stopPropagation();
    const wasOpen = menuDrop.classList.contains("open");
    document.querySelectorAll(".menu-dropdown.open").forEach(d => d.classList.remove("open"));
    if (!wasOpen) menuDrop.classList.add("open");
  };
  actions.appendChild(menuWrap);

  const btn = document.createElement("button");
  btn.className = "btn" + (isRunning ? "" : " primary");
  btn.textContent = isRunning ? "Stop" : "Start";
  btn.onclick = () => action(isRunning ? "stop" : "start", p.id);
  actions.appendChild(btn);

  row.appendChild(actions);
  return row;
}

function renderProfiles(s) {
  if (document.querySelector(".menu-dropdown.open")) return;
  const query = document.getElementById("profile-search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";

  const profiles = query
    ? s.profiles.filter(p =>
        p.name.toLowerCase().includes(query) ||
        (p.description && p.description.toLowerCase().includes(query)))
    : s.profiles;

  if (!profiles.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = query
      ? "No profiles match your search."
      : "No profiles found. Add a .conf file to your profiles directory.";
    list.appendChild(empty);
    return;
  }

  const byId = Object.fromEntries(profiles.map(p => [p.id, p]));
  const favSet = new Set(s.favorites);
  const lastUsedId = s.last_used && byId[s.last_used] ? s.last_used : null;
  // Favorites in storage order, minus last_used (which gets its own slot).
  const favs = s.favorites.filter(id => id !== lastUsedId && byId[id]);
  // Everything else, alphabetical by display name (already sorted by API).
  const others = profiles.filter(p => p.id !== lastUsedId && !favSet.has(p.id));

  if (lastUsedId) {
    list.appendChild(profileRow(byId[lastUsedId], s, {
      isLastUsed: true,
      isFavorite: favSet.has(lastUsedId),
    }));
  }

  if (favs.length) {
    list.appendChild(sectionHeader("★ Favorites"));
    favs.forEach((id, i) => list.appendChild(profileRow(byId[id], s, {
      isFavorite: true,
      showArrows: favs.length > 1,
      canMoveUp: i > 0,
      canMoveDown: i < favs.length - 1,
    })));
  }

  if (others.length) {
    // Only label this section if there's something above to distinguish it from.
    if (lastUsedId || favs.length) list.appendChild(sectionHeader("Other profiles"));
    others.forEach(p => list.appendChild(profileRow(p, s, {
      isFavorite: favSet.has(p.id),
    })));
  }
}

async function refreshState() {
  let s;
  try { s = await (await fetch("/api/state")).json(); }
  catch { document.getElementById("status").textContent = "connection lost"; return; }

  _lastState = s;
  renderProfiles(s);

  window._autoOpen = s.auto_open_model_ui;

  if (_pendingAutoOpen && s.ready && s.port) {
    window.open(`http://localhost:${s.port}`, "_blank", "noopener");
    _pendingAutoOpen = false;
  }
  if (!s.running) _pendingAutoOpen = false;
}

async function action(verb, id) {
  const r = await fetch(`/api/${verb}?profile=${encodeURIComponent(id)}`, { method: "POST" });
  const j = await r.json().catch(() => ({}));
  if (verb === "start" && j.ok && window._autoOpen && j.port) {
    _pendingAutoOpen = true;
  }
  if (!j.ok && j.error) alert(j.error);
  refreshState();
}

async function favoriteAction(id) {
  await fetch(`/api/favorite?profile=${encodeURIComponent(id)}`, { method: "POST" });
  refreshState();
}

async function moveAction(id, direction) {
  await fetch(`/api/move?profile=${encodeURIComponent(id)}&direction=${direction}`, { method: "POST" });
  refreshState();
}

async function copyAction(id) {
  const r = await (await fetch(`/api/profile/copy?profile=${encodeURIComponent(id)}`, { method: "POST" })).json();
  if (!r.ok) { alert("Copy failed: " + r.error); return; }
  refreshState();
}

async function deleteAction(id, name) {
  if (!confirm(`Delete profile "${name}"? This cannot be undone.`)) return;
  const r = await (await fetch(`/api/profile/delete?profile=${encodeURIComponent(id)}`, { method: "POST" })).json();
  if (!r.ok) { alert("Delete failed: " + r.error); return; }
  refreshState();
}

// Close any open dropdown when clicking outside.
document.addEventListener("click", () =>
  document.querySelectorAll(".menu-dropdown.open").forEach(d => d.classList.remove("open")));

// --- settings panel ---
async function loadSettings() {
  const r = await (await fetch("/api/config")).json();
  restartFields = r.restart_fields || [];
  const container = document.getElementById("settings-fields");
  container.innerHTML = Object.entries(FIELD_META).map(([key, meta]) => {
    const val = r.config[key];
    const restartTag = restartFields.includes(key)
      ? '<span class="restart-tag">restart needed</span>' : '';
    if (meta.type === "checkbox") {
      return `<div class="field checkbox">
        <input type="checkbox" id="f-${key}" ${val ? 'checked' : ''}>
        <label for="f-${key}">${meta.label}${restartTag}</label>
      </div>`;
    }
    return `<div class="field">
      <label for="f-${key}">${meta.label}${restartTag}</label>
      <input type="${meta.type}" id="f-${key}" value="${String(val).replace(/"/g, '&quot;')}">
      ${meta.hint ? `<div class="hint">${meta.hint}</div>` : ''}
    </div>`;
  }).join("");
  document.getElementById("save-msg").textContent = "";
}

async function saveSettings(ev) {
  ev.preventDefault();
  const body = {};
  for (const [key, meta] of Object.entries(FIELD_META)) {
    const el = document.getElementById("f-" + key);
    if (meta.type === "checkbox")    body[key] = el.checked;
    else if (meta.type === "number") body[key] = Number(el.value);
    else                             body[key] = el.value;
  }
  const msg = document.getElementById("save-msg");
  msg.className = ""; msg.textContent = "saving…"; msg.style.opacity = "1";
  try {
    const r = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!j.ok) {
      msg.className = "err"; msg.textContent = "error: " + (j.error || "unknown");
    } else if (j.needs_restart) {
      msg.className = "warn"; msg.textContent = "saved — restart launcher for host/port to take effect";
      setTimeout(() => { msg.style.opacity = "0"; }, 2500);
      setTimeout(() => { msg.textContent = ""; msg.className = ""; msg.style.opacity = "1"; }, 3000);
    } else {
      msg.className = "ok"; msg.textContent = "saved";
      setTimeout(() => { msg.style.opacity = "0"; }, 1000);
      setTimeout(() => { msg.textContent = ""; msg.className = ""; msg.style.opacity = "1"; }, 1500);
    }
  } catch (e) {
    msg.className = "err"; msg.textContent = "save failed";
  }
}

// --- profile editor ---
let editingProfile = null;
let _editorViewOnly = false;

function _setEditorViewOnly(viewOnly) {
  _editorViewOnly = viewOnly;
  document.getElementById("editor-save-btn").style.display = viewOnly ? "none" : "";
  document.getElementById("editor-cancel-btn").textContent = viewOnly ? "Close" : "Cancel";
  document.getElementById("editor-content").readOnly = viewOnly;
  document.getElementById("editor-filename").readOnly = viewOnly;
}

function openNewEditor() {
  editingProfile = null;
  _setEditorViewOnly(false);
  document.getElementById("editor-title").textContent = "New profile";
  document.getElementById("editor-filename").value = "profile-id";
  document.getElementById("editor-content").value =
    "# name: \n# description: \n# type: llama\n\n# Execution parameters\n--model ";
  document.getElementById("editor-msg").className = "";
  document.getElementById("editor-msg").textContent = "";
  document.getElementById("modal-backdrop").classList.add("open");
  document.getElementById("editor-filename").focus();
  document.getElementById("editor-filename").select();
}

async function openEditor(id, name, viewOnly = false) {
  editingProfile = id;
  _setEditorViewOnly(viewOnly);
  document.getElementById("editor-title").textContent = viewOnly ? `View: ${name}` : `Edit: ${name}`;
  document.getElementById("editor-filename").value = id;
  const ta = document.getElementById("editor-content");
  const msg = document.getElementById("editor-msg");
  ta.value = ""; msg.className = ""; msg.textContent = "loading…";
  document.getElementById("modal-backdrop").classList.add("open");
  try {
    const j = await (await fetch(`/api/profile?profile=${encodeURIComponent(id)}`)).json();
    if (j.ok) { ta.value = j.content; msg.textContent = ""; if (!viewOnly) ta.focus(); }
    else { msg.className = "err"; msg.textContent = j.error || "load failed"; }
  } catch { msg.className = "err"; msg.textContent = "load failed"; }
}

function closeEditor() {
  document.getElementById("modal-backdrop").classList.remove("open");
  editingProfile = null;
  _setEditorViewOnly(false);
}

async function saveProfile() {
  if (_editorViewOnly) return;
  const content = document.getElementById("editor-content").value;
  const newName = document.getElementById("editor-filename").value.trim();
  const msg = document.getElementById("editor-msg");
  if (!newName) { msg.className = "err"; msg.textContent = "filename cannot be empty"; return; }
  msg.className = ""; msg.textContent = "saving…";
  const isNew = editingProfile === null;
  const targetId = isNew ? newName : editingProfile;
  const body = { content };
  if (isNew) body.is_new = true;
  if (!isNew && newName !== editingProfile) body.new_name = newName;
  try {
    const r = await fetch(`/api/profile?profile=${encodeURIComponent(targetId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (j.ok) {
      msg.className = "ok"; msg.textContent = "saved";
      setTimeout(closeEditor, 800);
      refreshState();
    } else {
      msg.className = "err"; msg.textContent = j.error || "save failed";
    }
  } catch { msg.className = "err"; msg.textContent = "save failed"; }
}

document.getElementById("modal-backdrop").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeEditor();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeEditor(); });

// --- boot ---
refreshState();
setInterval(refreshState, 2000);
</script>
